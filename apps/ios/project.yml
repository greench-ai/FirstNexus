name: FirstNexus
options:
  bundleIdPrefix: ai.FirstNexus
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  FirstNexusKit:
    path: ../shared/FirstNexusKit
  Swabble:
    path: ../swabble

schemes:
  FirstNexus:
    shared: true
    build:
      targets:
        FirstNexus: all
    test:
      targets:
        - FirstNexusTests
        - FirstNexusLogicTests
  FirstNexusLogicTests:
    shared: true
    build:
      targets:
        FirstNexusLogicTests: all
    test:
      targets:
        - FirstNexusLogicTests

targets:
  FirstNexus:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: FirstNexusShareExtension
        embed: true
      - target: FirstNexusActivityWidget
        embed: true
      - target: FirstNexusWatchApp
      - package: FirstNexusKit
      - package: FirstNexusKit
        product: FirstNexusChatUI
      - package: FirstNexusKit
        product: FirstNexusProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchExtension,$SRCROOT/../shared/FirstNexusKit,$SRCROOT/../swabble" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/FirstNexus.entitlements
        CODE_SIGN_STYLE: "$(NEXISCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXISCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXISCLAW_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NEXISCLAW_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          NEXISCLAW_PUSH_TRANSPORT: direct
          NEXISCLAW_PUSH_DISTRIBUTION: local
          NEXISCLAW_PUSH_RELAY_BASE_URL: ""
          NEXISCLAW_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          NEXISCLAW_PUSH_TRANSPORT: direct
          NEXISCLAW_PUSH_DISTRIBUTION: local
          NEXISCLAW_PUSH_RELAY_BASE_URL: ""
          NEXISCLAW_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FirstNexus
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.FirstNexus.ios
            CFBundleURLSchemes:
              - FirstNexus
        CFBundleShortVersionString: "$(NEXISCLAW_MARKETING_VERSION)"
        FirstNexusCanonicalVersion: "$(NEXISCLAW_IOS_VERSION)"
        CFBundleVersion: "$(NEXISCLAW_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.FirstNexus.ios.bgrefresh
        NSLocalNetworkUsageDescription: FirstNexus discovers and connects to your FirstNexus gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _FirstNexus-gw._tcp
        NSCameraUsageDescription: FirstNexus can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: FirstNexus uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: FirstNexus can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: FirstNexus needs microphone access for voice wake.
        NSMotionUsageDescription: FirstNexus may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: FirstNexus needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: FirstNexus uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        FirstNexusPushTransport: "$(NEXISCLAW_PUSH_TRANSPORT)"
        FirstNexusPushDistribution: "$(NEXISCLAW_PUSH_DISTRIBUTION)"
        FirstNexusPushRelayBaseURL: "$(NEXISCLAW_PUSH_RELAY_BASE_URL)"
        FirstNexusPushAPNsEnvironment: "$(NEXISCLAW_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  FirstNexusShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: FirstNexusKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXISCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXISCLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXISCLAW_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NEXISCLAW_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: FirstNexus Share
        CFBundleShortVersionString: "$(NEXISCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXISCLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  FirstNexusActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/FirstNexusActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXISCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXISCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXISCLAW_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: FirstNexus Activity
        CFBundleShortVersionString: "$(NEXISCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXISCLAW_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  FirstNexusWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: FirstNexusWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(NEXISCLAW_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(NEXISCLAW_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXISCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXISCLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXISCLAW_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NEXISCLAW_WATCH_APP_PROFILE)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: FirstNexus
        CFBundleShortVersionString: "$(NEXISCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXISCLAW_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(NEXISCLAW_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  FirstNexusWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(NEXISCLAW_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(NEXISCLAW_CODE_SIGN_STYLE)"
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXISCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXISCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXISCLAW_WATCH_EXTENSION_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NEXISCLAW_WATCH_EXTENSION_PROFILE)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: FirstNexus
        CFBundleShortVersionString: "$(NEXISCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXISCLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(NEXISCLAW_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  FirstNexusTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: FirstNexus
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXISCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXISCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.FirstNexus.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FirstNexus.app/FirstNexus"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: FirstNexusTests
        CFBundleShortVersionString: "$(NEXISCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXISCLAW_BUILD_VERSION)"

  FirstNexusLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: FirstNexusKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXISCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXISCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.FirstNexus.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: FirstNexusLogicTests
        CFBundleShortVersionString: "$(NEXISCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXISCLAW_BUILD_VERSION)"
