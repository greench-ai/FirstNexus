name: NexusClaw
options:
  bundleIdPrefix: ai.nexusclaw
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  NexusClawKit:
    path: ../shared/NexusClawKit
  Swabble:
    path: ../../Swabble

schemes:
  NexusClaw:
    shared: true
    build:
      targets:
        NexusClaw: all
    test:
      targets:
        - NexusClawTests
        - NexusClawLogicTests
  NexusClawLogicTests:
    shared: true
    build:
      targets:
        NexusClawLogicTests: all
    test:
      targets:
        - NexusClawLogicTests

targets:
  NexusClaw:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: NexusClawShareExtension
        embed: true
      - target: NexusClawActivityWidget
        embed: true
      - target: NexusClawWatchApp
      - package: NexusClawKit
      - package: NexusClawKit
        product: NexusClawChatUI
      - package: NexusClawKit
        product: NexusClawProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../.swiftformat" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/NexusClaw.entitlements
        CODE_SIGN_STYLE: "$(NEXUSCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXUSCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXUSCLAW_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NEXUSCLAW_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          NEXUSCLAW_PUSH_TRANSPORT: direct
          NEXUSCLAW_PUSH_DISTRIBUTION: local
          NEXUSCLAW_PUSH_RELAY_BASE_URL: ""
          NEXUSCLAW_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          NEXUSCLAW_PUSH_TRANSPORT: direct
          NEXUSCLAW_PUSH_DISTRIBUTION: local
          NEXUSCLAW_PUSH_RELAY_BASE_URL: ""
          NEXUSCLAW_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: NexusClaw
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.nexusclaw.ios
            CFBundleURLSchemes:
              - nexusclaw
        CFBundleShortVersionString: "$(NEXUSCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXUSCLAW_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.nexusclaw.ios.bgrefresh
        NSLocalNetworkUsageDescription: NexusClaw discovers and connects to your NexusClaw gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _nexusclaw-gw._tcp
        NSCameraUsageDescription: NexusClaw can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: NexusClaw uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: NexusClaw can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: NexusClaw needs microphone access for voice wake.
        NSMotionUsageDescription: NexusClaw may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: NexusClaw needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: NexusClaw uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NexusClawPushTransport: "$(NEXUSCLAW_PUSH_TRANSPORT)"
        NexusClawPushDistribution: "$(NEXUSCLAW_PUSH_DISTRIBUTION)"
        NexusClawPushRelayBaseURL: "$(NEXUSCLAW_PUSH_RELAY_BASE_URL)"
        NexusClawPushAPNsEnvironment: "$(NEXUSCLAW_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  NexusClawShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: NexusClawKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXUSCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXUSCLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXUSCLAW_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NEXUSCLAW_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: NexusClaw Share
        CFBundleShortVersionString: "$(NEXUSCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXUSCLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  NexusClawActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/NexusClawActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXUSCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXUSCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXUSCLAW_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: NexusClaw Activity
        CFBundleShortVersionString: "$(NEXUSCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXUSCLAW_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NexusClawWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: NexusClawWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXUSCLAW_WATCH_APP_BUNDLE_ID)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: NexusClaw
        CFBundleShortVersionString: "$(NEXUSCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXUSCLAW_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(NEXUSCLAW_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  NexusClawWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEXUSCLAW_WATCH_EXTENSION_BUNDLE_ID)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: NexusClaw
        CFBundleShortVersionString: "$(NEXUSCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXUSCLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(NEXUSCLAW_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  NexusClawTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: NexusClaw
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXUSCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXUSCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.nexusclaw.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NexusClaw.app/NexusClaw"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: NexusClawTests
        CFBundleShortVersionString: "$(NEXUSCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXUSCLAW_BUILD_VERSION)"

  NexusClawLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: NexusClawKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(NEXUSCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEXUSCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.nexusclaw.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: NexusClawLogicTests
        CFBundleShortVersionString: "$(NEXUSCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(NEXUSCLAW_BUILD_VERSION)"
